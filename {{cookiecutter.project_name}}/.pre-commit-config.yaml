{% if cookiecutter.hook_gitlint -%}
# prepare-commit-msg runs merge-issue-number; commit-msg runs gitlint
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
{% endif -%}
default_stages: [pre-commit]
default_language_version:
  python: python{{ cookiecutter.python_major_version }}.{{ cookiecutter.python_minor_version }}

repos:
  - repo: https://github.com/psf/black
    rev: {{ cookiecutter._black_version }}
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: {{ cookiecutter._flake8_version }}
    hooks:
      - id: flake8
        additional_dependencies: [dlint=={{ cookiecutter._dlint_version }}]
  - repo: https://github.com/pycqa/isort
    rev: {{ cookiecutter._isort_version }}
    hooks:
      - id: isort
        name: isort (python)
      - id: isort
        name: isort (cython)
        types: [cython]
      - id: isort
        name: isort (pyi)
        types: [pyi]
  - repo: https://github.com/mssalvatore/merge-issue-number-hook
    rev: v1.0.0
    hooks:
      - id: merge-issue-number
{%- if cookiecutter.hook_gitlint %}
  - repo: https://github.com/adamdelman/gitlint-commit-hook
    rev: {{ cookiecutter._gitlint_hook_version }}
    hooks:
      - id: gitlint
{%- if cookiecutter.require_jira_prefix or cookiecutter.require_pr_number_on_merge %}
        args: [{% if cookiecutter.require_jira_prefix %}--require-jira-prefix{% endif %}{% if cookiecutter.require_jira_prefix and cookiecutter.require_pr_number_on_merge %}, {% endif %}{% if cookiecutter.require_pr_number_on_merge %}--require-pr-number-on-merge{% endif %}]
{%- endif %}
{%- endif %}
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v{{ cookiecutter._mypy_version }}
    hooks:
      - id: mypy
        additional_dependencies: []
        exclude: "vulture_allowlist.py"
        args: [--ignore-missing-imports, --check-untyped-defs]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
{%- if cookiecutter.hook_shellcheck %}
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
    -   id: shellcheck
{%- endif %}
  - repo: https://github.com/jendrikseipp/vulture
    rev: v{{ cookiecutter._vulture_version }}
    hooks:
      - id: vulture
  - repo: https://github.com/mssalvatore/changelog-formatter-commit-hook
    rev: v1.0.0
    hooks:
      - id: changelog-formatter
