[project]
authors = [{name = "{{ cookiecutter.full_name }}", email="{{ cookiecutter.email }}"}]
classifiers=[
{%- if cookiecutter.license == "GPLv3" %}
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
{%- elif cookiecutter.license == "Apache" %}
    "License :: OSI Approved :: Apache Software License",
{%- elif cookiecutter.license == "MIT" %}
    "License :: OSI Approved :: MIT License",
{%- endif %}
    "Programming Language :: Python :: {{ cookiecutter.python_major_version }}.{{ cookiecutter.python_minor_version }}"
]
dependencies = []
description = "{{ cookiecutter.project_short_description }}"
dynamic = ["readme"]
{%- if cookiecutter.license is not none %}
license = "{{ cookiecutter.license }}"
{%- endif %}
name = "{{ cookiecutter.project_name }}"
requires-python = ">={{ cookiecutter.python_major_version }}.{{ cookiecutter.python_minor_version }}, <4.0"
version = "v0.1.0"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[project.urls]
Repository = "{{ cookiecutter.url }}"
{%- if not cookiecutter.hook_ruff %}

[tool.black]
line-length = 100
{%- endif %}

[tool.cruft]
skip = [
    "{{ cookiecutter.__project_slug }}/__init__.py",
    "README.md",
    "CHANGELOG.md",
    "vulture_allowlist.py"
]
{%- if cookiecutter.hook_ruff %}

[tool.ruff]
line-length = 100
# pre-commit passes files by name; without this, ruff ignores the exclude list for them
force-exclude = true
extend-exclude = [
{%- for excluded in cookiecutter.exclude_these_file_in_flake8.split(",") if excluded.strip() %}
    "{{ excluded.strip() }}",
{%- endfor %}
]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors, incl. E501 line length (flake8 parity)
    "W",    # pycodestyle warnings (flake8 parity)
    "C90",  # mccabe complexity (flake8 parity)
    "I",    # Import sorting (isort replacement)
    "S",    # Security checks (Bandit - primary dlint replacement)
    "B",    # Bugbear (common bugs and design issues)
    "BLE",  # Blind except checks
    "RUF",  # Astral's native rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Re-exports
    "I001",  # Import order may matter; isort skipped these files too
]
"tests/**" = [
    "S101",  # pytest relies on assert
    "S105",  # Hardcoded passwords are fine in test fixtures
    "S106",
    "S108",  # Temp file paths are fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.__project_slug }}"]
{%- else %}

[tool.isort]
known_first_party = "{{ cookiecutter.__project_slug }}"
line_length = 100
skip_glob="**/__init__.py"
### for compatibility with black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
{%- endif %}

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = 1
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(module)s.%(funcName)s.%(lineno)d: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-v --capture=sys tests"

[tool.vulture]
exclude=[]
paths = ["{{ cookiecutter.__project_slug }}", "vulture_allowlist.py"]

[tool.poetry]
include = ["CHANGELOG.md", "README.md"]

[tool.poetry.group.dev.dependencies]
{%- if cookiecutter.__project_type=="agent_plugin" %}
agent-plugin-builder = "{{ cookiecutter._agentpluginbuilder_version }}"
{%- endif %}
{%- if cookiecutter.hook_ruff %}
ruff = "{{ cookiecutter._ruff_version }}"
{%- else %}
black = "{{ cookiecutter._black_version }}"
dlint = "{{ cookiecutter._dlint_version }}"
flake8 = "{{ cookiecutter._flake8_version }}"
isort = "{{ cookiecutter._isort_version }}"
{%- endif %}
{%- if cookiecutter.__project_type=="agent_plugin" %}
monkey-agentpluginapi = "{{ cookiecutter._monkeyagentpluginapi_version }}"
monkey-types = "{{ cookiecutter._monkeytypes_version }}"
{%- endif %}
mypy = "{{ cookiecutter._mypy_version }}"
pudb = ">=2025.1.5"
pynvim = ">=0.4.3, <1.0.0"
pytest = ">=7.1.0, <8.0.0"
pytest-cov = ">=3.0.0, <4.0.0"
pytest-xdist = ">=3.3.1"
vulture = "{{ cookiecutter._vulture_version }}"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
